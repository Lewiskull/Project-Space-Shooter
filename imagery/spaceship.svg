<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9c3cf"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#aeb9c6"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ee4d3d"/>
      <stop offset="1" stop-color="#a92418"/>
    </linearGradient>
    <radialGradient id="cristal" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d6f3ff"/>
      <stop offset="0.5" stop-color="#3fa7e0"/>
      <stop offset="1" stop-color="#13446b"/>
    </radialGradient>
    <linearGradient id="fuego" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.5" stop-color="#ff9d2e"/>
      <stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </linearGradient>

    <g id="lado">
      <!-- Ala delta -->
      <path d="M56 58 L12 100 L12 110 L56 98 Z" fill="url(#rojo)" stroke="#6b1409" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M56 70 L22 100" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Aleta trasera -->
      <path d="M56 92 L45 116 L56 108 Z" fill="url(#rojo)" stroke="#6b1409" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>

  <!-- Llama -->
  <path d="M57 106 Q64 130 71 106 Z" fill="url(#fuego)"/>

  <!-- Alas -->
  <use xlink:href="#lado"/>
  <use xlink:href="#lado" transform="translate(128,0) scale(-1,1)"/>

  <!-- Tobera -->
  <rect x="55" y="98" width="18" height="9" rx="2" fill="#4b5563" stroke="#1f2937" stroke-width="1.2"/>

  <!-- Fuselaje -->
  <path d="M64 6 C75 24 77 50 75 100 L53 100 C51 50 53 24 64 6 Z"
        fill="url(#cuerpo)" stroke="#5b6675" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Cono rojo -->
  <path d="M64 6 C69 13 72 21 73.5 30 L54.5 30 C56 21 59 13 64 6 Z"
        fill="url(#rojo)" stroke="#6b1409" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- Franja -->
  <rect x="52.5" y="76" width="23" height="5" fill="url(#rojo)"/>

  <!-- Ventana redonda -->
  <circle cx="64" cy="52" r="9" fill="#8b95a3" stroke="#4b5563" stroke-width="1.2"/>
  <circle cx="64" cy="52" r="6.8" fill="url(#cristal)"/>
  <path d="M60 49 Q61 46.5 64 46" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.6" fill="none" stroke-linecap="round"/>
</svg>
