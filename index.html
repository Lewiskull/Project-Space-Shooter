<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceShooter</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="start-screen screen">
      <h1> Welcome to Megalovania</h1>
      <p>Use your keys ⬆️➡️⬅️⬇️ to move the spaceship</p>
      <p>Use your mouse click to shoot</p>
      <button class="start-btn">START GAME</button>
    </div>
    <div class="game-screen screen"></div>
    <div class="end-screen screen">
      <h1>GAME OVER</h1>
      <p>try again if you want to save the galaxy!</p>
      <button class="restart-btn">TRY AGAIN</button>
    </div>

    <script src="JS/game.js"></script>
    <script src="JS/index.js"></script>
    <script src="JS/player.js"></script>
    <script src="JS/enemy.js"></script>
    
  </body>
</html>
